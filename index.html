
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChangeWatch Live Test</title>
</head>
<body>
  <h1>ChangeWatch Live Test</h1>
  <h2>Product: Smart Device</h2>

  <p id="price">Price: $12</p>
  <p id="version">Version: 2</p>
  <p id="updated">Waiting for update</p>

  <script>
    let price = 12;
    let version = 2;

    function updateValues() {
      price++;
      version++;

      document.getElementById("price").textContent =
        "Price: $" + price;

      document.getElementById("version").textContent =
        "Version: " + version;

      document.getElementById("updated").textContent =
        "Last updated: " + new Date().toLocaleTimeString();
    }

    setInterval(updateValues, 60_000);
  </script>
</body>
</html>
